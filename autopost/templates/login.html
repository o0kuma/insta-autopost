<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 인스타 자동 게시</title>
  <meta name="theme-color" content="#d6336c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="인스타 게시">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-box">
    <div class="login-logo"><span class="logo-mark"></span>인스타 자동 게시</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" class="panel">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label class="field">
        <span>비밀번호</span>
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <button class="btn btn-primary btn-lg">들어가기</button>
    </form>
    <p class="muted small">한 번 로그인하면 이 기기에서 30일 동안 유지돼요.</p>
  </main>
</body>
</html>
